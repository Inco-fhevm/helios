name: Build opstack-server image

# Builds the helios opstack consensus server image from the `future`
# integration branch (= upstream master + Inco patches, notably the V4
# blocks gossip topic fix — upstream PR a16z/helios#801). Consumed by
# inco-gcp-infrastructure's helios-consensus ArgoCD addon. When a16z
# merges the fix upstream, `future` collapses back to an upstream
# mirror and this keeps building from it unchanged.

on:
  push:
    branches: [future]
    tags: ["opstack-server-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: inconetwork

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: inconetwork
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: inconetwork/helios-opstack-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.opstack-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
